# Package definition for RPM and DEB, built with nfpm.
#
# nfpm is used rather than rpmbuild so packages can be produced on any host,
# including a developer's macOS machine, with no distribution tooling installed.
name: apm2go
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: yigitf <yigitf@users.noreply.github.com>
description: |
  Standalone APM for applications already running on a host.

  apm2go discovers the services running on a host and instruments them without
  requiring a restart: Java through the JVM's own attach protocol, and Node.js,
  Python, Go and the web servers in front of them through eBPF. It stores the
  resulting traces in an embedded database and serves a web interface over them,
  with no external dependencies: no JDK, no database, and no separate collector.
vendor: yigitf
homepage: https://apm2go.fatihyigit.com
license: Apache-2.0

contents:
  - src: ./dist/apm2go_${ARCH}
    dst: /usr/bin/apm2go
    file_info:
      mode: 0755

  - src: ./packaging/config.yaml
    dst: /etc/apm2go/config.yaml
    type: config|noreplace

  - src: ./packaging/apm2go.service
    dst: /usr/lib/systemd/system/apm2go.service

  - dst: /var/lib/apm2go
    type: dir
    file_info:
      mode: 0750

scripts:
  postinstall: ./packaging/postinstall.sh
  preremove: ./packaging/preremove.sh

overrides:
  rpm:
    depends: []
  deb:
    depends: []
