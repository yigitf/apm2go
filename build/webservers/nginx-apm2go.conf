# An nginx reverse proxy in front of the Java chain, dropped into the
# distribution's conf.d rather than replacing its nginx.conf.
#
# Keeping the packaged configuration means nginx also keeps its default :80
# server, so this container listens on two ports at once — the ordinary shape
# of a real web server, and the case apm2go has to get right twice over: it
# must instrument both ports, and it must not let a port number this shares
# with the httpd container beside it select the wrong process.
#
# What apm2go gets from nginx, measured rather than assumed: a server span for
# the inbound request and a client span for the proxied call, so nginx's own
# latency and the fact that it called the gateway are both visible. What it
# does not get is the two joined to the backend's trace — see the note in
# build/e2e-multicontainer.sh.
server {
    listen 8100;
    server_name _;

    location / {
        proxy_pass http://gateway:8081/api/gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
