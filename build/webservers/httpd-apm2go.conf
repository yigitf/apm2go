# An Apache httpd reverse proxy in front of the Java chain, dropped into the
# distribution's conf.d for the same reason as the nginx one beside it: the
# packaged httpd.conf keeps its :80 listener, so this serves on two ports and
# exercises apm2go's multi-port selector.
#
# The proxy modules are loaded explicitly. Rocky's httpd ships them enabled in
# 00-proxy.conf, but a config that depends on another file having been read
# first fails in a way that looks like apm2go's problem, not Apache's.
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

Listen 8101

<VirtualHost *:8101>
    ProxyPreserveHost On
    ProxyPass        / http://gateway:8081/api/gateway
    ProxyPassReverse / http://gateway:8081/api/gateway
</VirtualHost>
