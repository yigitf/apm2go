name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `make test` builds the whole tree in a container and runs gofmt, go vet
      # and the unit tests inside it, so the runner needs no Go, Node.js or JDK.
      - name: Run the test suite
        run: make test
